AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 4.0
  UseCache: false
# Keep the empty line optional: forcing it stretches short methods
Layout/EmptyLineAfterGuardClause:
  Enabled: false
Layout/LineEndStringConcatenationIndentation:
  EnforcedStyle: indented
Lint/Debugger:
  Enabled: false
Metrics:
  Enabled: false
Naming/MethodParameterName:
  Enabled: false
Style/Documentation:
  Enabled: false
Style/FrozenStringLiteralComment:
  Enabled: false
